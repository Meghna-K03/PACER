<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACER - Voice Interview</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

    <div class="header">
        <h1>PACER 🎯</h1>
        <p>Voice Mock Interview</p>
    </div>

    <div class="form-group">
        <label>Target Company</label>
        <input type="text" id="company" placeholder="eg. TCS, Google" value="TCS">
    </div>

    <div class="form-group">
        <label>Question to Answer</label>
        <textarea id="question" rows="3"
            style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;">What is the difference between a stack and a queue?</textarea>
    </div>

    <div style="text-align:center; margin:20px 0;">

        <button id="startBtn" onclick="startRecording()"
            style="background:#27ae60; margin-bottom:10px;">
            🎤 Start Recording
        </button>

        <button id="stopBtn" onclick="stopRecording()"
            style="background:#e74c3c; display:none; margin-bottom:10px;">
            ⏹ Stop Recording
        </button>

        <p id="status"
            style="color:#888; margin-top:10px; font-size:14px;">
            Click Start Recording and speak your answer
        </p>

        <div id="timer"
            style="font-size:24px; font-weight:bold; color:#e74c3c; display:none;">
            00:00
        </div>

    </div>

    <div id="result" style="display:none;">
        <div class="card-section">
            <h3>What PACER heard:</h3>
            <p id="transcript"
                style="color:#444; line-height:1.6; font-style:italic;">
            </p>
        </div>
        <div class="card-section" style="margin-top:20px;">
            <h3>PACER's Feedback:</h3>
            <p id="feedback"
                style="color:#444; line-height:1.8; white-space:pre-wrap;">
            </p>
        </div>
        <button onclick="resetInterview()"
            style="margin-top:20px; background:#2c3e50;">
            🔄 Try Another Question
        </button>
    </div>

    <a href="/" class="back-button">← Back to Home</a>

</div>

<script>
let mediaRecorder;
let audioChunks = [];
let timerInterval;
let seconds = 0;

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            await submitAudio(audioBlob);
            stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start(100);

        // Update UI
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'inline-block';
        document.getElementById('status').textContent = 'Recording... speak your answer now';
        document.getElementById('status').style.color = '#e74c3c';
        document.getElementById('timer').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        // Start timer
        seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${secs}`;
        }, 1000);

    } catch (err) {
        document.getElementById('status').textContent =
            'Microphone access denied. Please allow microphone in browser settings.';
        document.getElementById('status').style.color = '#e74c3c';
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        clearInterval(timerInterval);

        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
        document.getElementById('status').textContent = 'Processing your answer... please wait';
        document.getElementById('status').style.color = '#f39c12';
    }
}

async function submitAudio(audioBlob) {
    const formData = new FormData();
    formData.append('audio', audioBlob, 'answer.webm');
    formData.append('question', document.getElementById('question').value);
    formData.append('company', document.getElementById('company').value);

    document.getElementById('status').textContent = 'PACER is scoring your answer...';

    try {
        const response = await fetch('/score-answer', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        document.getElementById('transcript').textContent = data.transcript;
        document.getElementById('feedback').textContent = data.feedback;
        document.getElementById('result').style.display = 'block';
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('status').textContent = 'Done! See your feedback below.';
        document.getElementById('status').style.color = '#27ae60';

    } catch (error) {
        document.getElementById('status').textContent = 'Error processing audio. Try again.';
        document.getElementById('status').style.color = '#e74c3c';
        document.getElementById('startBtn').style.display = 'inline-block';
        console.error(error);
    }
}

function resetInterview() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('status').textContent = 'Click Start Recording and speak your answer';
    document.getElementById('status').style.color = '#888';
    document.getElementById('startBtn').style.display = 'inline-block';
    seconds = 0;
}
</script>

</body>
</html>
