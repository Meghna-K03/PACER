<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACER - Placement Prep Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="active">🏠 Home</a>
    <a href="/interview">🎤 Voice Interview</a>
    <a href="/history">📊 My History</a>
</nav>

<div class="container">
    <div class="header">
        <h1>PACER 🎯</h1>
        <p>Your AI-powered placement prep agent</p>
    </div>

    <form action="/generate" method="post" onsubmit="showLoading()">

        <div class="form-group">
            <label>Your Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number (for WhatsApp alerts)</label>
            <input type="text" name="phone" placeholder="eg. 9876543210 (without +91)" required>
        </div>

        <div class="form-group">
            <label>Branch</label>
            <input type="text" name="branch" placeholder="eg. Computer Science" required>
        </div>

        <div class="form-group">
            <label>Target Company</label>
            <input type="text" name="company" placeholder="eg. TCS, Infosys, Google" required>
        </div>

        <div class="form-group">
            <label>CGPA</label>
            <input type="text" name="cgpa" placeholder="eg. 7.8" required>
        </div>

        <div class="form-group">
            <label>Your Skills</label>
            <input type="text" name="skills" placeholder="eg. Python, Java, SQL" required>
        </div>

        <button type="submit" id="submit-btn">
            Generate My Questions 🚀
        </button>

    </form>

    <div id="loading" style="display:none; text-align:center; padding:30px;">
        <div class="spinner"></div>
        <p style="color:#666; margin-top:16px; font-size:15px;">
            PACER is preparing your questions...
        </p>
        <p style="color:#888; font-size:13px;">
            This takes about 10-15 seconds
        </p>
    </div>

</div>

<script>
function showLoading() {
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
}
</script>

</body>
</html>
